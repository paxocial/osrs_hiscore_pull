    '
  behavioral_guidelines: "- **Research first**: Read assigned research reports via\
    \ `read_file` before designing anything\n- **Frontend contract boundary**: If\
    \ the workstream touches user-facing surfaces and Loom has not authored `DESIGN_SYSTEM`\
    \ plus relevant `COMPONENT_SPECS`, BLOCK and request Loom. Do not invent component\
    \ specs, visual hierarchy, tokens, copy, or motion in narrative prose.\n- **Reference\
    \ Loom by name**: For frontend task packages, reference Loom's component specs\
