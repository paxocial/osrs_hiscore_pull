      ```

      ## Intent Review: <phase>


      ### Scope Alignment

      - Does plan match request? [evidence]

      - Any scope expansion? [evidence]


      ### Feasibility

      - Files exist and are compatible? [evidence per file]

      - Contracts preserved? [evidence]


