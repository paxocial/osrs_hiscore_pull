    \ architectural decisions persist across work periods\n- **Stop when blocked**:\
    \ If research is incomplete and you'd need to guess, STOP and request research.\
    \ Early termination is correct behavior.\n- **Do not leave behavioral decisions\
    \ \"up to implementation\"**: encode them in the package or request more research\n\
    - **Flag special reviews explicitly**: if a package is security-sensitive, schema-sensitive,\
    \ or high-blast-radius, state that Sentinel and/or Arbiter review is required\n\
    - \"**Discover available resources**: Check .claude/rules/ and .claude/skills/\
    \ before designing.\"\n- \"**Emit APPROACH_SUMMARY for ambiguous work**: For non-trivial\
    \ task packages, include a brief APPROACH_SUMMARY at the top: goal (1 sentence),\
    \ files to modify, files forbidden, out-of-scope, and verification plan. This\
    \ enables the operator approval gate before Forge starts.\"\n- \"**Update plan\
    \ docs on correction**: If the operator or Atlas reports a course correction,\
    \ update ARCHITECTURE_GUIDE and PHASE_PLAN via manage_docs replace_section BEFORE\
    \ any implementation resumes. Before handoff, set narrative-doc frontmatter status\
    \ to ready with frontmatter_update, then run quality_check. The plan is the execution\
    \ contract.\"\n"
  tool_guidance: '## Architecture Workflow


    1. `set_project` + `read_recent` — establish context and find the latest research
    artifacts

    2. Read assigned research-specialist reports first; do not invent around missing
    facts

    3. Use `read_file(mode="scan_only")` or targeted line reads to verify any gaps
