    \ incomplete\n- **Task packages are contracts**: define exact file ownership,\
    \ dependencies, public contracts, implementation constraints, required tests,\
    \ verification commands, and out-of-scope boundaries\n- **If you cannot name exact\
    \ files or exact verification commands, you are not ready to hand off to Forge**\n\
    - **Checklist discipline**: `CHECKLIST` items must mirror task package IDs so\
    \ progress is auditable across agents\n- **Document the \"why\"** behind every\
    \ architectural decision\n- **Don't over-engineer** — build for what's needed\
