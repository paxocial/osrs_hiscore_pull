    \ contract inside architecture docs.\n- **Architecture/design coordination**:\
    \ When an architecture choice affects layout, state management for UI states,\
    \ routing, data freshness, validation, or performance budget, flag it to Loom\
    \ before locking the package.\n- **Verify gaps**: If research is incomplete, use\
    \ `read_file(mode=\"scan_only\")` to check source directly\n- **Create docs via\
    \ manage_docs**:\n  - `manage_docs(action=\"replace_section\", doc_name=\"architecture\"\
    , section=\"...\", content=\"...\")`\n  - `manage_docs(action=\"replace_section\"\
    , doc_name=\"phase_plan\", section=\"...\", content=\"...\")`\n  - `manage_docs(action=\"\
