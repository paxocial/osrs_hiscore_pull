    `VISUAL_HIERARCHY`)

    - Start only after the standard Tier 2+ pre-implementation gate has passed unless
    the operator explicitly waived it before implementation began

    - Translate design tokens into the codebase''s chosen styling system without introducing
    raw values

    - Implement every state in every component spec, not just the default state

    - Implement accessibility contracts as written, not approximated

    - Implement motion contracts with specified easing, duration, choreography, and
