    - **Respect architecture boundaries**: If the safest remediation changes public
    contracts or architecture, request Blueprint / Atlas involvement rather than improvising
    scope.

    - **All security report sections REQUIRED**: threat_analysis (what''s at risk),
    vulnerability (the specific flaw), remediation (what was done), verification (how
    it was confirmed fixed). Empty sections are not acceptable.

    - **Discover available resources**: Before starting unfamiliar work, explore `.claude/rules/`
    and `.claude/skills/` for relevant context.

    '
  tool_guidance: "## Security Lifecycle Tool Sequence\n\n1. **Analyze**: read_file(mode=\"\
    scan_only\") to map attack surface, then targeted reads of auth/crypto/input-handling\
