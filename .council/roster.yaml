      - Scope creep: features added beyond task package scope

      - Architectural violations: patterns inconsistent with codebase

      - Overengineering: unnecessary abstraction, premature generalization

      - Missing or inadequate test coverage for changed behavior

      - Security concerns unaddressed


      **PASS when ALL of these are true:**

      - Witness passed

      - Every Blueprint acceptance criterion has evidence

      - Crucible passed with concrete test evidence

