council:
  name: osrs_hiscore_pull
  version: 2.0.0
  hooks:
    shared_secret: null
    web_url: http://localhost:8015
    request_timeout: 5.0
    registry: {}
  sessions:
    stale_timeout_minutes: 240
    max_concurrent_per_persona: 0
    cleanup_on_startup: true
    stale_cleanup_interval_seconds: 1800
    stale_session_timeout_minutes: 180
  memories:
    default_visibility: private
    default_strength: 0.5
    neuroplasticity_enabled: true
    promote_default_strength: 0.7
    default_strength_by_type:
      semantic: 0.6
      episodic: 0.7
      abstract: 0.7
      synthesis: 0.7
  messages:
    urgent_blocking_enabled: true
    auto_thread: true
    retention_days: 0
    pending_messages_limit: 10
  access:
    require_project_id: true
    allow_cross_project: false
    default_cross_persona: false
    omniscient_roles:
    - operator
    - admin
    - omniscient
    cross_agent_roles:
    - coordinator
    - auditor
    reserved_personas:
    - operator
    - system
    - ALL
    enforce_tool_restrictions: false
    allowed_tools: []
    blocked_tools: []
    blocked_paths: []
    max_tokens_per_session: 0
    protected_agents: []
  decay:
    enabled: true
    half_life_days: 30
    min_strength: 0.05
  reinforcement:
    enabled: true
    access_boost: 0.05
    max_daily_boost: 0.2
    min_interval_hours: 1
  memory:
    tier_thresholds:
      t1_max_strength: 0.3
      t1_max_arousal: 0.2
      t3_min_arousal: 0.7
      t3_min_strength: 0.85
    arousal_weights:
      emotional: 0.8
      ethical: 0.1
      truth: 0.1
  reflection:
    on_session_close: true
    auto_reflect_on_close: true
    min_session_duration: 5
    micro_reflections_enabled: true
    micro_allowed_layers:
    - semantic
    - abstract
    contradiction_detection: true
    coherence_threshold: 0.4
    dream_cycles_enabled: false
    dreams:
      enabled: true
      max_seed_scan: 200
      max_clusters_per_run: 3
      min_cluster_size: 3
      strong_memory_threshold: 0.7
    patterns:
      enabled: true
    layer_strengths:
      semantic: 0.6
      episodic: 0.7
      abstract: 0.7
      synthesis: 0.7
  queries:
    default_limit: 20
    max_limit: 100
    include_embeddings: false
  llm:
    primary_provider: oss
    fallback_to_openai: false
    oss_context_limit: 8000
    openai_model: gpt-5-mini
    temperature: 0.7
    max_response_tokens: 1024
  prompts:
    override_dir: .council/prompts
    first_person_mode: strict
    include_memory_metadata: true
    max_context_memories: 12
    budget:
      pools:
        personal:
          tokens: 4000
        domain:
          tokens: 4000
        session:
          tokens: 2000
        reasoning:
          tokens: 2000
      soft_cap: 12000
  reminders:
    max_count: 10
  transport:
    mode: stdio
    ws_host: 0.0.0.0
    ws_port: 8016
    ws_path: /mcp
    require_daemon: false
    timeouts:
      stderr_read: 1.0
      subprocess_ready: 60.0
      init: 10.0
      shutdown: 5.0
      websocket_read: 30.0
      tool_call_default: 30.0
    ws_client:
      initial_attempts: 3
      initial_delay_seconds: 0.2
      max_retries: 20
  client:
    heartbeat_seconds: 30
    stale_seconds: 180
  web:
    host: 0.0.0.0
    port: 8015
    reload: true
    reload_dirs:
    - web
    - api
    - agents
    - core
    reload_includes:
    - '*.py'
    reload_excludes: []
    reload_delay_seconds: 0.5
    shutdown_timeout_seconds: 10
    session_cookie_name: council_session
    session_cookie_days: null
    session_cookie_secure: false
    session_cookie_httponly: true
    session_cookie_samesite: lax
    login_url: http://localhost:8015/api/auth/login
    reload_delay_ms: 500
    browser_reconnect_base_ms: 500
    browser_reconnect_cap_ms: 10000
    connection_status_enabled: true
    custom_pages_enabled: true
    hidden_pages: []
    hidden_nav_items: []
    nav_group_label: OSRS Control
    custom_static_enabled: true
    nav_acronyms:
    - MCP
    - SDK
    - API
    - UI
    - CLI
    - LLM
    - AI
    - DB
    - WS
    - HTTP
    - URL
    - ID
  daemon:
    pre_restart_notify_url: http://127.0.0.1:8015/api/daemon/pre-restart
    pre_restart_timeout: 3.0
    pre_restart_grace_period: 1.0
    project_resolution_retry_delays:
    - 1
    - 2
    log_filename: daemon.log
    log_max_size_mb: 10
    log_backup_count: 3
    restart_http_timeout: 3
    cleanup_stale_on_start: true
  ws_proxy:
    default_url: ws://127.0.0.1:8016/mcp
    ping_interval_seconds: 20.0
    ping_timeout_seconds: 120.0
    max_reconnect_attempts: 20
    default_client_type: terminal
    dev_mode_backoff_cap_seconds: 5
    dev_mode_max_retries: 10
    inactivity_timeout_seconds: 300
  ask:
    scribe_context_entries: 5
    scribe_context_token_budget: 500
  limits:
    memory_query_default: 10
    pattern_mining_query: 50
    session_context_memories: 20
    coherence_check_memories: 50
  bridges:
    scribe_health_check_timeout: 1.0
    scribe_tool_timeout: 5.0
  server:
    resolver_retry_delays_seconds:
    - 1
    - 2
    - 4
  process_manager:
    health_check_interval_seconds: 30
    heartbeat_stale_multiplier: 2.0
    default_grace_seconds: 5.0
    max_restarts_before_giveup: 3
    restart_backoff_base_seconds: 1.0
    restart_backoff_cap_seconds: 60.0
    registry_db_path: .council/process_registry.db
    reboot_timeout_seconds: 30
  system_health:
    enabled: true
    check_interval_seconds: 60
    include_gpu: true
    gpu_command: nvidia-smi
    disk_paths:
    - /
    alert_thresholds:
      cpu_percent: 90.0
      memory_percent: 90.0
      disk_percent: 95.0
      gpu_memory_percent: 95.0
      temperature_celsius: 90.0
  logs:
    log_dir: .
    default_tail_lines: 50
    max_tail_lines: 5000
    stream_poll_interval_ms: 500
    level_patterns:
      error: (?i)\b(ERROR|CRITICAL|FATAL)\b
      warning: (?i)\b(WARNING|WARN)\b
      info: (?i)\b(INFO)\b
      debug: (?i)\b(DEBUG)\b
    known_sources:
      daemon:
        path: daemon.log
        format: plain
      web:
        path: web_ui.log
        format: plain
  agents:
    types:
      valid_types:
      - claude_code
      - web_ui
      - service
      - webhook
      default_type: claude_code
  chat:
    enabled: true
    default_agent: osrs-atlas
    auto_open: false
    persist_session: true
    page_agents:
      /pages/osrs-dashboard: bridge
      /pages/osrs-jobs: snapshot
      /pages/osrs-snapshots: report
  sdk:
    enabled: true
    max_concurrent_sessions: 10
    worker_startup_timeout_seconds: 30
    session_create_timeout_seconds: 60
    worker_idle_timeout_seconds: 0
    worker_heartbeat_interval_seconds: 15
    uds_socket_dir: /tmp
    uds_socket_prefix: council_sdk_
    uds_max_message_bytes: 10485760
    stream_buffer_size: 100
    event_queue_timeout_seconds: 60
    ws_endpoint: /ws/sdk
    approval_timeout_seconds: 300
    approval_auto_deny_on_timeout: true
    persist_messages: true
    message_retention_days: 30
    default_provider: codex
    providers:
      claude:
        enabled: true
        cli_path: null
        default_model: claude-sonnet-4-5
        fallback_model: claude-3-5-haiku
        models:
        - claude-sonnet-4-5
        - claude-sonnet-4-5-20250929
        - claude-opus-4-6
        - claude-opus-4-5
        - claude-haiku-4-5-20251001
        - claude-3-5-haiku
        permission_mode: default
        setting_sources:
        - project
        max_budget_usd: 10.0
        max_turns: 100
        include_partial_messages: true
        max_thinking_tokens: null
        betas: []
        env: {}
      openai:
        enabled: false
        default_model: gpt-4o
        max_budget_usd: 10.0
      codex:
        enabled: true
        display_name: OpenAI Codex
        cli_path: codex
        default_model: gpt-5.3-codex
        fallback_model: gpt-5.2-codex
        fallback_models:
        - gpt-5.2-codex
        - gpt-5-codex
        models:
        - gpt-5.3-codex
        - gpt-5.2-codex
        - gpt-5-codex
        sandbox_mode: workspace-write
        skip_git_repo_check: true
        full_auto: false
        dangerously_bypass_approvals_and_sandbox: false
        enforce_cwd_restrictions: true
        allowed_cwd_roots: []
        strict_fork_isolation: true
        max_budget_usd: 10.0
        env: {}
      zlm:
        enabled: false
        display_name: ZLM (GLM)
        default_model: GLM-4.7
        fallback_model: GLM-4.5-Air
        models:
        - GLM-4.7
        - GLM-4.7-Flash
        - GLM-4.5-Air
        - GLM-4.5-Flash
        - GLM-4.7-FlashX
        permission_mode: default
        setting_sources:
        - project
        max_budget_usd: 10.0
        max_turns: 100
        include_partial_messages: true
        max_thinking_tokens: null
        betas: []
        env:
          api_key_var: ZAI_API_KEY
          base_url: https://api.z.ai/api/anthropic
          timeout_ms: 3000000
    warm_pool_size: 0
    warm_pool_idle_timeout_seconds: 300
    warm_pool_check_interval_seconds: 30
    sandbox:
      enabled: true
      temp_dir_prefix: council_sandbox_
      temp_dir_base: /tmp
      permission_mode: default
      include_mcp_servers: false
      allowed_tools:
      - Read
      - Glob
      - Grep
      - WebFetch
      - WebSearch
      cleanup_on_end: true
  cost_tracking:
    enabled: true
    pricing:
      claude:
        claude-sonnet-4-5:
          input_per_mtok: 3.0
          output_per_mtok: 15.0
        claude-sonnet-4-5-20250929:
          input_per_mtok: 3.0
          output_per_mtok: 15.0
        claude-opus-4-6:
          input_per_mtok: 15.0
          output_per_mtok: 75.0
        claude-opus-4-5:
          input_per_mtok: 15.0
          output_per_mtok: 75.0
        claude-haiku-4-5-20251001:
          input_per_mtok: 0.8
          output_per_mtok: 4.0
        claude-3-5-haiku:
          input_per_mtok: 0.8
          output_per_mtok: 4.0
      openai:
        gpt-4o:
          input_per_mtok: 2.5
          output_per_mtok: 10.0
        gpt-4o-mini:
          input_per_mtok: 0.15
          output_per_mtok: 0.6
      codex:
        gpt-5.3-codex:
          input_per_mtok: 2.5
          output_per_mtok: 10.0
        gpt-5.2-codex:
          input_per_mtok: 2.5
          output_per_mtok: 10.0
        gpt-5-codex:
          input_per_mtok: 2.5
          output_per_mtok: 10.0
      zlm:
        GLM-4.7:
          input_per_mtok: 0.6
          output_per_mtok: 2.2
        GLM-4.7-Flash:
          input_per_mtok: 0.0
          output_per_mtok: 0.0
        GLM-4.7-FlashX:
          input_per_mtok: 0.07
          output_per_mtok: 0.4
        GLM-4.5-Air:
          input_per_mtok: 0.2
          output_per_mtok: 1.1
        GLM-4.5-Flash:
          input_per_mtok: 0.0
          output_per_mtok: 0.0
  retrieval:
    min_tier: null
    max_per_tag_cluster: 3
    recency_half_life_days: 30
    dual_pool:
      personal_weight: 0.6
      domain_weight: 0.4
  context:
    max_context_tokens: 6000
    max_thread_events: 50
  reasoning:
    governance_enabled: true
    log_passes: true
    pass_1_temperature: 0.5
    pass_2_temperature: 0.7
    pass_3_temperature: 0.3
  explore:
    max_limit: 50
  daemon_federation:
    enabled: true
    shared_secret: ''
    timeout_seconds: 10
    max_retries: 3
  display_name: OSRS Hiscore
  generation:
    key_directories:
    - path: agents
      description: Snapshot and report orchestration agents
    - path: core
      description: Hiscore client, normalization, and delta logic
    - path: web
      description: Existing FastAPI web UI and dashboard routes
    - path: api
      description: API entrypoints and transport-facing endpoints
    - path: tests
      description: Regression and integration test suite
    - path: docs
      description: Dev plans, runbooks, and operator notes
    rules:
    - '!atlas-discipline'
    - '!pipeline-gates'
    - '!orchestration-law'
    - '!agentkit-schema'
  description: Council for OSRS hiscore ingestion, reporting, and web operations
  repo_path: null
  parent_council_name: null
  council_id: 413a9cfc-f79f-4087-86ed-3ba17561c84f
federation:
  enabled: false
  scope: ancestors
  push_to_parent: false
  pull_scope: ancestors
policy:
  mode: inherit
  restrict_only_fields:
  - hooks.registry.*.allowed_sources
  - access.max_sessions
search:
  default_scope: local
council_id: 413a9cfc-f79f-4087-86ed-3ba17561c84f
