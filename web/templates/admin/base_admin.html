{% extends "base.html" %}

{% block extra_head %}
<link rel="stylesheet" href="/static/css/admin.css">
{% endblock %}

{% block content %}
<div class="admin-container">
  <nav class="admin-nav">
    <a href="/admin/" {% if request.url.path == "/admin/" %}class="active"{% endif %}>📊 Dashboard</a>
    <a href="/admin/users" {% if "/users" in request.url.path %}class="active"{% endif %}>👥 Users</a>
    <a href="/admin/audit-logs" {% if "/audit-logs" in request.url.path %}class="active"{% endif %}>📝 Audit Logs</a>
    <a href="/admin/rate-limits" {% if "/rate-limits" in request.url.path %}class="active"{% endif %}>🚦 Rate Limits</a>
    <a href="/admin/clans" {% if "/clans" in request.url.path %}class="active"{% endif %}>⚔️ Clans</a>
    <a href="/admin/config" {% if "/config" in request.url.path %}class="active"{% endif %}>⚙️ Config</a>
  </nav>

  {% block admin_content %}{% endblock %}
</div>
{% endblock %}
