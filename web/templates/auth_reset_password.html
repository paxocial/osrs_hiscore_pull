{% extends "base.html" %}
{% block content %}
<section class="card auth-card">
  <h2>Reset Password</h2>
  <p class="lede">Enter your new password below.</p>
  {% if error %}
    <div class="alert error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/auth/reset-password" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token if csrf_token is defined else '' }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New Password
      <input type="password" name="password" required autofocus>
    </label>
    <label>Confirm New Password
      <input type="password" name="confirm_password" required>
    </label>
    <p class="help-text">Password must be at least 12 characters and include uppercase, lowercase, number, and special character.</p>
    <div class="form-actions">
      <button class="btn primary" type="submit">Reset Password</button>
    </div>
  </form>
</section>
{% endblock %}
